<h1>Airlines</h1>
<div class="airline-list">
  @for (airline of airlineList(); track airline.id) {
    <app-airline-list-item
      [airline]="airline"
      (opened)="onAirlineClicked($event)"/>
  } @empty {
    <p>No airlines to show yet.</p>
  }
</div>
<h2>{{ filterType }} Airlines ({{ filteredAirlineCount() }})</h2>
<div class="filtered-airline-list">
  @for (filteredAirline of filteredAirlineList(); track filteredAirline.id) {
    <app-airline-list-item
      [airline]="filteredAirline"
      (opened)="onAirlineClicked($event)"/>
  } @empty {
    <p>No cargo airlines to show yet.</p>
  }
</div>
